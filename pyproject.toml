[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robs-coffee"
version = "1.1.0"
description = "Personal daily briefing: stocks, Cape Town weather, SpaceX, world events"
authors = [{name = "Rob"}]
requires-python = ">=3.9"
dependencies = [
    "yfinance>=0.2.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
]

[project.scripts]
coffee = "coffee:main"
