        function ageLabel(hours) {
            if (hours === undefined || hours === null) return '';
            if (hours < 24) return hours + 'h • ';
            const days = Math.floor(hours / 24);
            return days + 'd • ';
        }

        function fmtPct(val) {
            if (val === undefined || val === null) return '<span class="text-slate-500">-</span>';
            const sign = val >= 0 ? '+' : '';
            const color = val >= 0 ? 'text-emerald-400' : 'text-red-400';
            return `<span class="${color} font-medium">${sign}${val.toFixed(1)}%</span>`;
        }

        function colorPctString(val) {
            if (!val) return '';
            const color = val.trim().startsWith('-') ? 'text-red-400' : 'text-emerald-400';
            return `<span class="${color}">${val}</span>`;
        }

        function daysUntil(iso) {
            try {
                const target = new Date(iso);
                const now = new Date();
                const diff = Math.ceil((target.getTime() - now.getTime()) / 86400000);
                if (diff < 0) return null;
                if (diff === 0) return 'today';
                if (diff === 1) return 'tomorrow';
                return `in ${diff} days`;
            } catch (e) {
                return null;
            }
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                else current += char;
            }
            result.push(current.trim());
            return result;
        }

        async function loadHoldings() {
            const container = document.getElementById('holdings-table');
            const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQdpXOT5NT0T56hhGJrBBXG5o9cO9GptY8QaDsWuY92qmB_yHc7q00eXRmLQAwu0LBoakYhVty1JBV7/pub?gid=35247126&single=true&output=csv';
            try {
                const res = await fetch(sheetUrl);
                const text = await res.text();
                const lines = text.trim().split('\n');
                let html = `<table class="w-full">
                    <thead><tr class="border-b border-slate-700 text-slate-400">
                        <th class="text-left py-1 font-medium">Ticker</th>
                        <th class="text-right py-1 font-medium">Qty</th>
                        <th class="text-right py-1 font-medium">Price</th>
                        <th class="text-right py-1 font-medium">USD</th>
                        <th class="text-right py-1 font-medium">ZAR</th>
                    </tr></thead><tbody>`;
                let inTrueSection = false;
                let tslaZarTotal = 0;
                const strip = (v) => (v || '').replace(/"/g, '').trim();
                const fmtQty = (raw) => {
                    if (!raw) return '';
                    const n = Number(raw.replace(/,/g, ''));
                    return isNaN(n) ? raw : n.toLocaleString();
                };
                for (let i = 0; i < lines.length; i++) {
                    const row = parseCSVLine(lines[i]);
                    let firstCol = strip(row[0]);
                    const account = strip(row[1]);
                    const qtyRaw = strip(row[2]);
                    const price = strip(row[3]);
                    const usd = strip(row[4]);
                    let zar = strip(row[5]);
                    if (firstCol === 'TRUE') { inTrueSection = true; continue; }
                    if (inTrueSection && (firstCol === 'Joy' || firstCol === 'Jack' || firstCol === 'garth' || firstCol === 'Bon')) break;
                    if (!inTrueSection) continue;
                    if (!firstCol && (usd || zar)) firstCol = 'Total';
                    if (!firstCol) continue;
                    if (!qtyRaw && !usd && !zar) continue;
                    const label = account && !firstCol.toLowerCase().includes('total') ? `${firstCol} ${account}` : firstCol;
                    if (firstCol.startsWith('TSLA') && !firstCol.toLowerCase().includes('total')) {
                        const zarMatch = zar.match(/R\s*([\d.,]+)\s*([kmKM]?)/i);
                        if (zarMatch) {
                            let val = parseFloat(zarMatch[1].replace(/,/g, ''));
                            const suffix = (zarMatch[2] || '').toLowerCase();
                            if (suffix === 'k') val *= 1000;
                            if (suffix === 'm') val *= 1000000;
                            tslaZarTotal += val;
                        }
                    }
                    if (firstCol.toLowerCase().includes('total') && !zar && tslaZarTotal > 0) {
                        zar = `R ${(tslaZarTotal / 1000000).toFixed(1)}m`;
                    }
                    html += `<tr class="border-b border-slate-800">
                        <td class="py-1 font-medium">${label}</td>
                        <td class="py-1 text-right font-semibold">${fmtQty(qtyRaw)}</td>
                        <td class="py-1 text-right text-slate-400">${price}</td>
                        <td class="py-1 text-right text-slate-400">${usd}</td>
                        <td class="py-1 text-right text-slate-400">${zar}</td>
                    </tr>`;
                }
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = `<div class="text-red-400 text-sm">Could not load holdings from Google Sheets.</div>`;
            }
        }

        async function loadCapeTownWeather() {
            const container = document.getElementById('cape-town-weather');
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-33.9249&longitude=18.4241&hourly=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,cloud_cover,precipitation&timezone=Africa/Johannesburg');
                const data = await res.json();
                const weatherDesc = (code) => ({
                    0: "Clear", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
                    45: "Fog", 61: "Light rain", 63: "Rain", 65: "Heavy rain"
                }[code] || "Mixed");
                const hours = [1, 3, 6, 12, 24];
                let html = '';
                hours.forEach(h => {
                    const temp = Math.round(data.hourly.temperature_2m[h]);
                    const code = data.hourly.weather_code[h];
                    const wind = Math.round(data.hourly.wind_speed_10m[h]);
                    const dir = data.hourly.wind_direction_10m[h];
                    const cloud = Math.round(data.hourly.cloud_cover[h]);
                    const rain = data.hourly.precipitation[h];
                    const badForHiking = wind > 30 || rain > 0.5 || temp < 8 || temp > 32 || (cloud > 90 && wind > 20);
                    const hikingNote = badForHiking ? `<span class="text-red-400 text-xs ml-1">Bad for hiking</span>` : '';
                    const arrows = wind > 35 ? '↑↑↑' : (wind > 20 ? '↑↑' : '↑');
                    html += `<div class="flex justify-between items-center border-b border-slate-800 pb-1.5 last:border-0 last:pb-0">
                        <div>
                            <div class="font-medium">+${h}h</div>
                            <div class="text-sm text-slate-400">${weatherDesc(code)}${hikingNote}</div>
                        </div>
                        <div class="text-right text-sm">
                            <div class="font-semibold">${temp}°C</div>
                            <div>${wind} km/h <span style="display:inline-block; transform: rotate(${dir + 180}deg);">${arrows}</span></div>
                            <div class="text-slate-400">Cloud ${cloud}%${rain > 0 ? ` • Rain ${Math.round(rain)}mm` : ''}</div>
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = `<div class="text-slate-400 text-sm">Cape Town forecast unavailable</div>`;
            }
        }

        function renderLaunches() {
            const container = document.getElementById('launches-list');
            const wrap = document.getElementById('launches-wrap');
            const now = Date.now() - 2 * 3600 * 1000;
            const upcoming = (EMBEDDED_DATA.launches || []).filter(l => {
                if (!l.dateISO) return true;
                try { return new Date(l.dateISO).getTime() >= now; } catch (e) { return true; }
            });
            if (!upcoming.length) {
                wrap.style.display = 'none';
                return;
            }
            wrap.style.display = '';
            container.innerHTML = upcoming.map(l => {
                const rel = l.dateISO ? daysUntil(l.dateISO) : null;
                const relText = rel ? ` (${rel})` : '';
                const star = l.highlight ? '★ ' : '';
                const inner = `<div class="font-medium text-violet-300">${star}${l.name}</div>
                    <div class="text-slate-400 text-sm">${l.date}${relText}</div>
                    ${l.details ? `<div class="text-slate-500 text-sm">${l.details}</div>` : ''}`;
                if (l.link) {
                    return `<a href="${l.link}" target="_blank" rel="noopener" class="row block rounded-lg px-1 py-1 -mx-1">${inner}</a>`;
                }
                return `<div class="py-1">${inner}</div>`;
            }).join('');
        }

        function renderWorldEvents() {
            const wrap = document.getElementById('world-wrap');
            const container = document.getElementById('world-events');
            const events = EMBEDDED_DATA.worldEvents || [];
            if (!events.length) {
                wrap.classList.add('hidden');
                return;
            }
            wrap.classList.remove('hidden');
            container.innerHTML = events.map(event => {
                const line = `<span class="text-slate-500">${ageLabel(event.hoursAgo)}</span>${event.text}`;
                if (event.link) {
                    return `<a href="${event.link}" target="_blank" rel="noopener" class="row block rounded-lg py-0.5">${line}</a>`;
                }
                return `<div>${line}</div>`;
            }).join('');
        }

        function renderNews() {
            const wrap = document.getElementById('news-wrap');
            const container = document.getElementById('company-news');
            const items = EMBEDDED_DATA.companyNews || EMBEDDED_DATA.news || [];
            if (!items.length) {
                wrap.classList.add('hidden');
                return;
            }
            wrap.classList.remove('hidden');
            container.innerHTML = items.map(item => {
                const line = `<span class="text-slate-500">${ageLabel(item.hoursAgo)}</span>${item.title}`;
                const source = item.source ? `<div class="text-sm text-slate-500">${item.source}</div>` : '';
                if (item.link) {
                    return `<a href="${item.link}" target="_blank" rel="noopener" class="row block rounded-lg py-0.5">${line}${source}</a>`;
                }
                return `<div>${line}${source}</div>`;
            }).join('');
        }

        function renderCalendar() {
            const wrap = document.getElementById('calendar-wrap');
            const container = document.getElementById('calendar-list');
            const items = EMBEDDED_DATA.calendar || [];
            if (!items.length) {
                wrap.classList.add('hidden');
                return;
            }
            wrap.classList.remove('hidden');
            container.innerHTML = items.map(ev =>
                `<div><span class="text-slate-500">${ev.when} • </span>${ev.title}</div>`
            ).join('');
        }

        function btcLabel(n) {
            if (!n || isNaN(n)) return '';
            return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : n.toLocaleString();
        }

        function keyCard(id, html) {
            return `<div id="key-${id}" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2">${html}</div>`;
        }

        function renderKeyNumbers() {
            const container = document.getElementById('key-numbers');
            const k = EMBEDDED_DATA.keyNumbers || {};
            const zarWeekColor = (k.usdZarWeek || '').startsWith('-') ? 'text-emerald-400' : 'text-red-400';
            const zarHint = k.usdZarLabel || '';
            const btcWeekColor = (k.btcWeek || '').startsWith('-') ? 'text-red-400' : 'text-emerald-400';
            const btcNum = parseFloat((k.btc || '').toString().replace(/,/g, ''));

            let html = '';
            html += keyCard('usdZar', `<div>R${k.usdZar || '-'}/$</div><div class="text-sm ${zarWeekColor}">${k.usdZarWeek || ''} ${zarHint}</div>`);
            html += keyCard('btc', `<div>BTC $${btcLabel(btcNum) || '-'}</div><div class="text-sm ${btcWeekColor}">${k.btcWeek || ''} 1w</div>`);

            let jse = `JSE ${colorPctString(k.jse)}`;
            if (k.sp500) jse += `<div class="text-sm text-slate-400">S&P ${colorPctString(k.sp500)}</div>`;
            html += keyCard('jse', jse);

            if (k.keyEvent) html += keyCard('keyEvent', k.keyEvent);
            if (k.tslaShortInterest && !String(k.tslaShortInterest).toLowerCase().includes('no major')) {
                html += keyCard('tslaShort', `TSLA short ${k.tslaShortInterest}`);
            }
            container.innerHTML = html;

            fetch('https://api.exchangerate-api.com/v4/latest/USD')
                .then(r => r.json())
                .then(d => {
                    const zar = d.rates && d.rates.ZAR ? d.rates.ZAR.toFixed(2) : k.usdZar;
                    const el = document.getElementById('key-usdZar');
                    if (el) el.innerHTML = `<div>R${zar}/$</div><div class="text-sm ${zarWeekColor}">${k.usdZarWeek || ''} ${zarHint}</div>`;
                })
                .catch(() => {});

            fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd')
                .then(r => r.json())
                .then(d => {
                    const n = d.bitcoin && d.bitcoin.usd ? d.bitcoin.usd : btcNum;
                    const el = document.getElementById('key-btc');
                    if (el) el.innerHTML = `<div>BTC $${btcLabel(n)}</div><div class="text-sm ${btcWeekColor}">${k.btcWeek || ''} 1w</div>`;
                })
                .catch(() => {});
        }

        function updateTimestamp() {
            const el = document.getElementById('last-updated');
            if (!el) return;
            const raw = EMBEDDED_DATA.updatedAt;
            if (raw) {
                const d = new Date(raw);
                el.textContent = d.toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
            } else {
                el.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
        }

        function warnIfStale() {
            const el = document.getElementById('stale-banner');
            if (!el) return;
            const raw = EMBEDDED_DATA.updatedAt;
            if (!raw) return;
            const ageH = (Date.now() - new Date(raw).getTime()) / 3600000;
            if (ageH < 36) {
                el.classList.add('hidden');
                return;
            }
            const days = Math.floor(ageH / 24);
            el.classList.remove('hidden');
            el.textContent = `This briefing is ${days} days old. Numbers below are not live.`;
        }

        function init() {
            warnIfStale();
            renderStockTable();
            renderKeyNumbers();
            renderLaunches();
            renderWorldEvents();
            renderNews();
            renderCalendar();
            loadCapeTownWeather();
            loadHoldings();
            updateTimestamp();
        }

        async function boot() {
            try {
                const res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
                if (res.ok) {
                    const fresh = await res.json();
                    if (fresh && fresh.stocks && Object.keys(fresh.stocks).length) {
                        Object.assign(EMBEDDED_DATA, fresh);
                    }
                }
            } catch (e) {}
            init();
        }

        window.onload = boot;
    </script>
</body>
</html>
