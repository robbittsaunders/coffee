name: Refresh briefing

on:
  schedule:
    # 06:00 SAST every day, plus hourly through the US cash session (Mon-Fri)
    - cron: "0 4 * * *"
    - cron: "20 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Refresh embedded data
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
        run: python update_coffee.py

      - name: Commit if changed
        run: |
          git config user.name "rob-coffee-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robs-coffee.html index.html data.json
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Refresh briefing data"
          git push
